pre-commit:
# ah:managed:start
  ah-check:
    run: ah check
# ah:managed:end

  parallel: true
  commands:
    # ddl:managed:start (pre-commit)
    ddl-ah-check:
      run: ah check
    ddl-pretender-gate:
      run: pretender check --mode gate
    ddl-spk-lint:
      run: spk lint openspec
    # ddl:managed:end (pre-commit)
# ah:managed:start
    ah-check:
      run: ah check
# ah:managed:end
    type-check:
      run: just type-check
    lint:
      run: just lint

pre-push:
  parallel: true
  commands:
    # ddl:managed:start (pre-push)
    ddl-ah-check:
      run: ah check
    # ddl:managed:end (pre-push)
    fmt:
      run: just fmt-check
    lint:
      run: just lint
    test:
      # Run only affected tests via testaruda --safe (falls back to cargo test)
      run: testaruda select --safe --base origin/main --head HEAD
