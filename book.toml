[book]
title = "pretender"
authors = ["charly vibes"]
description = "Language-agnostic code quality CLI"
src = "docs/src"

[build]
build-dir = "book"

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
additional-css = ["theme/charly.css"]
git-repository-url = "https://github.com/charly/pretender"
edit-url-template = "https://github.com/charly/pretender/edit/main/{path}"
