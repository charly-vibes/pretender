# Corpus manifest — ticket pretender-uwz (calibrate `excessive_fields_max`).
#
# Schema (version 1):
#   schema_version = 1                # integer; bump on any breaking schema change
#   [[repo]]                          # one entry per corpus repo
#     name        = string            # cache directory name (<cache-dir>/<name>)
#     url         = string            # public https git URL; credentials rejected
#     pin         = string            # released tag (preferred) or 40-hex commit;
#                                     # fetch-corpus.sh fails loudly if it does not resolve
#     license     = string            # SPDX expression, read off the repo's LICENSE* files
#                                     # at the pin; re-verify when bumping a pin
#     language    = string            # primary language: rust|go|python|java|csharp|typescript
#     approx_loc  = integer           # ballpark source lines, planning only — never asserted
#
# Format choice — TOML over JSON: pretender's own config surface is TOML
# (pretender.toml), TOML carries the per-entry and schema comments a corpus
# needs for review, and the only parser the calibration scripts need is
# python3's stdlib `tomllib` (>= 3.11). Both scripts already shell out to
# python3 for JSON aggregation, so no new tool dependency is introduced.
#
# Pins: stable released tags only. Every result calibrate-fields.sh emits is
# keyed by the pin recorded next to it, so a bumped pin visibly invalidates
# earlier runs. A wrong pin aborts that repo's fetch with a clear error;
# correct the pin in this file rather than working around the script.
#
# Licenses: all entries are permissive (MIT / Apache-2.0 / BSD-3-Clause /
# Unlicense). Each value was transcribed from the repo's LICENSE* files at
# the pinned tag while authoring this manifest; `fetch-corpus.sh
# --check-licenses` re-greps the checked-out LICENSE*/COPYING* files against
# the SPDX family as a tripwire, and pins should be re-verified manually on
# bump (license files occasionally change with releases).

schema_version = 1

